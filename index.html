<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="基于 GitHub Pages 的物理问题讨论站：一道道问题与解答，题目附件以 PDF 呈现。">
<title>物理讨论站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-6 6v-6H8a4 4 0 0 1-4-4z' fill='%232d5f8f'/%3E%3Cpath d='M16 7c-3.2 0-5.5 2.2-5.5 5h3c0-1.4 1-2.3 2.5-2.3s2.5.9 2.5 2.2c0 1.1-.7 1.6-1.9 2.4-1.3.9-2.1 1.9-2.1 3.7h3c0-.9.4-1.4 1.7-2.2 1.4-.9 2.3-2 2.3-3.9C21 9.2 18.8 7 16 7z' fill='%23fff'/%3E%3Ccircle cx='16' cy='21.6' r='1.8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=1">
<link id="css-katex" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link id="css-hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<link id="css-hljs-dark" rel="stylesheet" disabled href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="config.js?v=1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script defer src="assets/core.js?v=1"></script>
<script defer src="assets/app.js?v=1"></script>
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-6 6v-6H8a4 4 0 0 1-4-4z" fill="var(--accent)"/>
        <path d="M16 7c-3.2 0-5.5 2.2-5.5 5h3c0-1.4 1-2.3 2.5-2.3s2.5.9 2.5 2.2c0 1.1-.7 1.6-1.9 2.4-1.3.9-2.1 1.9-2.1 3.7h3c0-.9.4-1.4 1.7-2.2 1.4-.9 2.3-2 2.3-3.9C21 9.2 18.8 7 16 7z" fill="var(--accent-ink)"/>
        <circle cx="16" cy="21.6" r="1.8" fill="var(--accent-ink)"/>
      </svg>
      <span id="site-name">物理讨论站</span>
    </a>
    <nav class="site-nav">
      <a href="#/" id="nav-list">问题</a>
      <a href="#/about" id="nav-about">关于</a>
      <button class="icon-btn" id="theme-toggle" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
      <button class="btn ghost small" id="admin-btn">站主登录</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ 列表视图 ============ -->
  <section id="view-list">
    <div class="list-col">
      <div class="list-tools">
        <div class="search-box">
          <span class="search-ico" aria-hidden="true">🔍</span>
          <input id="search" type="search" placeholder="搜索标题、题面、来源或标签…" autocomplete="off">
        </div>
        <button class="icon-btn" id="refresh-btn" title="刷新列表（绕过缓存）">⟳</button>
      </div>
      <div id="list-count" class="list-count"></div>
      <div id="status-bar" class="status-bar"></div>
      <div id="tag-bar" class="tag-bar"></div>
      <div id="list-status"></div>
      <div id="paper-list" class="paper-list"></div>
      <div id="list-more" class="list-more"></div>
    </div>
  </section>

  <!-- ============ 阅读视图（内容由 JS 填充） ============ -->
  <section id="view-read" hidden></section>

  <!-- ============ 关于视图（内容由 JS 填充） ============ -->
  <section id="view-about" hidden></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footer-src" class="muted"></p>
    <p>由 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> 驱动的纯静态讨论站 ·
       <a href="#" id="footer-admin">站主入口</a> · 姊妹站：<a href="https://principia-rain.github.io/Principaper/" target="_blank" rel="noopener">论文站</a></p>
  </div>
</footer>

<div id="toast-root"></div>
<div id="modal-root"></div>

<noscript>
  <div class="wrap noscript-note">本站需要启用 JavaScript 才能加载问题列表（纯静态站点，无任何跟踪脚本）。</div>
</noscript>

</body>
</html>
